services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-horizon-ai

    # Bind to localhost only - not exposed to internet
    ports:
      - "127.0.0.1:5000:5000"

    environment:
      - API_HOST=0.0.0.0  # Inside container, bind to all interfaces
      - API_PORT=5000
      - NEWS_API_KEY=${NEWS_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

    volumes:
      - ./.env:/app/.env:ro
      - ai-results:/app/results
      - ai-logs:/app/logs

    command: python api_server.py

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ai-results:
    driver: local
  ai-logs:
    driver: local

networks:
  default:
    name: event-horizon-ai-network
