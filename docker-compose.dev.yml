services:
  event-horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: event-horizon:dev
    container_name: event-horizon-dev

    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1

    volumes:
      # Mount source code for hot reload
      - ./agents:/app/agents
      - ./services:/app/services
      - ./utils:/app/utils
      - ./main.py:/app/main.py
      - ./api_server.py:/app/api_server.py

      # Configuration
      - ./config.dev.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro

      # Output
      - ./results:/app/results
      - ./logs:/app/logs
      - ./data:/app/data

    command: python main.py

    restart: "no"

    stdin_open: true
    tty: true

    ports:
      - "8000:8000"
      - "5000:5000"

    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  default:
    name: event-horizon-network
