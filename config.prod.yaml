# Event Horizon - Production Configuration

agents:
  # News Agent - Disabled in production for cost control
  news_agent:
    enabled: false
    config:
      max_articles_per_stock: 10
      days_back: 7
      language: "en"

  # Report Agent - Enabled in production
  report_agent:
    enabled: true
    config:
      include_financials: true
      earnings_periods: 8        # More historical data
      top_holdings: 20           # More holdings
      download_sec_filings: false

# API Keys (from environment variables)
api_keys:
  news_api_key: ${NEWS_API_KEY}

# Data Sources
data_sources:
  yfinance:
    enabled: true
    description: "Yahoo Finance data (free, parsed)"

  sec_edgar:
    enabled: false
    description: "SEC official filings (future)"

# Logging - Production settings
logging:
  level: "INFO"                 # Less verbose
  save_to_file: true

# Output - Production paths
output:
  save_json: true
  json_directory: "/app/results"
  pretty_print: false           # Compact JSON for production
