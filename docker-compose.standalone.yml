services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-horizon-backend

    ports:
      - "5000:5000"

    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - NEWS_API_KEY=${NEWS_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - event-horizon-results:/app/results
      - event-horizon-logs:/app/logs

    command: python api_server.py

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  event-horizon-results:
    driver: local
  event-horizon-logs:
    driver: local

networks:
  default:
    name: event-horizon-network
