services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-horizon-ai

    # Bind to localhost only - not exposed to internet
    # Your BE will connect to this via http://localhost:8001
    ports:
      - "127.0.0.1:8001:8001"

    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

    volumes:
      - ./.env:/app/.env:ro
      - ai-results:/app/results
      - ai-logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - event-horizon-network

volumes:
  ai-results:
    driver: local
  ai-logs:
    driver: local

networks:
  event-horizon-network:
    name: event-horizon-network
    driver: bridge
