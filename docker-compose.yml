services:
  event-horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-horizon
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8000}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-mistralai/Ministral-3-14B-Reasoning-2512}
      - SKIP_VLLM=${SKIP_VLLM:-false}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    volumes:
      - model-cache:/root/.cache/huggingface
      - agents-data:/data
    ports:
      - "8030:8030"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped

volumes:
  model-cache:
  agents-data:
