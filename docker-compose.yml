services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventhorizon-backend
    ports:
      - "4000:4000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - NEWS_API_KEY=${NEWS_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - backend-results:/app/results
      - backend-logs:/app/logs
    command: python api_server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventhorizon-network

networks:
  eventhorizon-network:
    name: eventhorizon-network
    driver: bridge

volumes:
  backend-results:
  backend-logs:
