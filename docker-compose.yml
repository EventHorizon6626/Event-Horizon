version: '3.8'

services:
  backend:
    build:
      context: ./Event-Horizon-AI
      dockerfile: Dockerfile
    container_name: eventhorizon-backend
    ports:
      - "4000:4000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - NEWS_API_KEY=${NEWS_API_KEY}
      - FRONTEND_URL=http://frontend:3000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./Event-Horizon-AI/config.yaml:/app/config.yaml:ro
      - ./Event-Horizon-AI/.env:/app/.env:ro
      - backend-results:/app/results
      - backend-logs:/app/logs
    command: python api_server.py
    restart: unless-stopped
    networks:
      - eventhorizon-network

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: eventhorizon-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_BE_API_URL=http://backend:4000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eventhorizon-network

networks:
  eventhorizon-network:
    driver: bridge

volumes:
  backend-results:
  backend-logs:
