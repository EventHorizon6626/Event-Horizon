apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-horizon-results-pvc
  namespace: event-horizon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Optional: Specify storage class
  # storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-horizon-logs-pvc
  namespace: event-horizon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
