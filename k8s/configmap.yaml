apiVersion: v1
kind: ConfigMap
metadata:
  name: event-horizon-config
  namespace: event-horizon
data:
  config.yaml: |
    # Event Horizon Configuration
    agents:
      news_agent:
        enabled: false
        config:
          max_articles_per_stock: 5
          days_back: 7
          language: "en"

      report_agent:
        enabled: true
        config:
          include_financials: true
          earnings_periods: 8
          top_holdings: 20

    api_keys:
      news_api_key: ${NEWS_API_KEY}

    data_sources:
      yfinance:
        enabled: true
      sec_edgar:
        enabled: false

    logging:
      level: "INFO"
      save_to_file: true

    output:
      save_json: true
      json_directory: "/app/results"
      pretty_print: false
