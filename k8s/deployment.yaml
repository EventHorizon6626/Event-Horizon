apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-horizon
  namespace: event-horizon
  labels:
    app: event-horizon
    version: v1
spec:
  replicas: 1  # Increase for high availability
  selector:
    matchLabels:
      app: event-horizon
  template:
    metadata:
      labels:
        app: event-horizon
        version: v1
    spec:
      containers:
      - name: event-horizon
        image: event-horizon:latest
        imagePullPolicy: Always

        # Resource limits and requests
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Environment variables
        env:
        - name: NEWS_API_KEY
          valueFrom:
            secretKeyRef:
              name: event-horizon-secrets
              key: NEWS_API_KEY
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"

        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: results
          mountPath: /app/results
        - name: logs
          mountPath: /app/logs

        # Liveness probe (check if container is alive)
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3

        # Readiness probe (check if ready to receive traffic)
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10

      # Volumes
      volumes:
      - name: config
        configMap:
          name: event-horizon-config
      - name: results
        persistentVolumeClaim:
          claimName: event-horizon-results-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: event-horizon-logs-pvc

      # Restart policy
      restartPolicy: Always

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
