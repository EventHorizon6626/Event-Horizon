services:
  event-horizon:
    image: event-horizon:latest
    container_name: event-horizon-prod

    environment:
      - NEWS_API_KEY=${NEWS_API_KEY}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1

    volumes:
      # Configuration (read-only)
      - ./config.prod.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro

      # Output (persistent named volumes)
      - event-horizon-results:/app/results
      - event-horizon-logs:/app/logs
      - event-horizon-data:/app/data

    restart: always

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"
        compress: "true"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  event-horizon-results:
    driver: local
  event-horizon-logs:
    driver: local
  event-horizon-data:
    driver: local

networks:
  default:
    name: event-horizon-network
