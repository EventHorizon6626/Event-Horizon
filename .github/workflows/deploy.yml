name: Deploy AI Service to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy AI Service Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy AI Service to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 Starting AI Service deployment..."

            # Navigate to Event-Horizon-AI directory
            cd ${{ secrets.DEPLOY_PATH }}/Event-Horizon-AI

            # Pull latest AI code
            echo "📥 Pulling latest AI service code..."
            git pull origin main

            # Stop existing container (to free port 5000)
            echo "🛑 Stopping existing AI container..."
            docker-compose down || true

            # Deploy AI service
            echo "🐳 Building and deploying AI service..."
            docker-compose up -d --build

            # Show status
            echo "✅ AI Service deployment complete!"
            docker-compose ps

            # Test health endpoint
            echo "🏥 Testing AI service health..."
            sleep 5
            curl -f http://localhost:5000/health || echo "⚠️  Health check failed"

            # Clean up old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ AI Service successfully deployed to production!"
          echo "🤖 AI API available at http://your-server-ip:5000"
          echo "📚 API docs at http://your-server-ip:5000/docs"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ AI Service deployment failed! Check the logs above for details."
          exit 1
