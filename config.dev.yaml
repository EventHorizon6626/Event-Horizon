# Event Horizon - Development Configuration

agents:
  # News Agent - Enabled for testing
  news_agent:
    enabled: true
    config:
      max_articles_per_stock: 3  # Fewer for faster testing
      days_back: 3
      language: "en"

  # Report Agent - Enabled
  report_agent:
    enabled: true
    config:
      include_financials: true
      earnings_periods: 2        # Less data for speed
      top_holdings: 5            # Fewer holdings
      download_sec_filings: false

# API Keys (from environment variables)
api_keys:
  news_api_key: ${NEWS_API_KEY}

# Data Sources
data_sources:
  yfinance:
    enabled: true
    description: "Yahoo Finance data"

  sec_edgar:
    enabled: false

# Logging - Development settings
logging:
  level: "DEBUG"                # Verbose for debugging
  save_to_file: true

# Output - Development paths
output:
  save_json: true
  json_directory: "."
  pretty_print: true            # Readable JSON for debugging
